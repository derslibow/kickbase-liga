name: Kickbase-Daten aktualisieren & Seite veröffentlichen

on:
  schedule:
    # Zeiten in UTC (deutsche Zeit = UTC+1 im Winter, UTC+2 im Sommer).
    # Täglich nach der Marktwert-Anpassung um 22 Uhr: 22:15 Uhr deutscher Zeit (Winter 21:15 UTC, Sommer 20:15 UTC)
    - cron: '15 20,21 * * *'
    # Zusätzlich alle 3 Stunden für Transfers/Aufstellungen
    - cron: '40 */3 * * *'
    # Spieltage (Fr–So) nachmittags/abends stündlich für Live-Punkte
    - cron: '50 14-21 * * 5,6,0'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Alles komplett neu laden'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kickbase-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Daten von Kickbase holen
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_ID: ${{ secrets.KICKBASE_LEAGUE_ID }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: node scripts/update.mjs
      - name: Neuen Stand speichern
        run: |
          git config user.name "kickbase-bot"
          git config user.email "kickbase-bot@users.noreply.github.com"
          git add public/data/league.json
          git diff --cached --quiet || git commit -m "Daten aktualisiert [skip ci]"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
